<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome | Digital Information</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    color: #222;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.header {
    text-align: center;
    padding: 30px 10px;
}

.header h1 {
    font-size: 28px;
    color: #17356b;
    margin-bottom: 12px;
}

.header p {
    color: #555;
    line-height: 1.6;
    font-size: 15px;
}

.video-container {
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    margin: 20px 0;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

video {
    display: block;
    width: 100%;
    height: auto;
}

.info {
    background: #fff;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
    margin: 20px 0;
}

.info h2 {
    color: #17356b;
    margin-bottom: 12px;
}

.info p {
    color: #555;
    line-height: 1.7;
}

.whatsapp-btn {
    display: block;
    width: 100%;
    padding: 17px;
    background: #25D366;
    color: white;
    text-align: center;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    margin: 20px 0;
}

.whatsapp-btn:hover {
    background: #1da851;
}

.footer {
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: #777;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Welcome!</h1>
        <p>
            Thank you for visiting our page.
            Watch the video below to learn more.
        </p>
    </div>

    <!-- VIDEO PLAYER -->
    <div class="video-container">
        <video controls playsinline preload="metadata">
            <source src="1000160522.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>
    </div>

    <!-- INFORMATION -->
    <div class="info">
        <h2>Need More Information?</h2>
        <p>
            If you have any questions or need
            further information, feel free to
            connect with us directly.
            We will be happy to assist you.
        </p>
    </div>

    <!-- WHATSAPP BUTTON -->
    <a
      class="whatsapp-btn"
      href="https://wa.me/918808174910"
      target="_blank"
      rel="noopener noreferrer">
      Chat With Us on WhatsApp
    </a>

    <div class="footer">
        Thank you for visiting!
    </div>

</div>

</body>
</html>
